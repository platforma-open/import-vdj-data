  - software/region-annotation
  - software/xlsx-to-csv
  - test
  - ui
  - workflow

catalog:
  canonicalize: ~2.1.0
  "@platforma-sdk/model": 1.81.1
  "@platforma-sdk/ui-vue": 1.81.1
  "@platforma-sdk/workflow-tengo": 6.8.2
  "@platforma-sdk/block-tools": 2.14.3
  "@platforma-sdk/test": 1.81.3
  "@platforma-sdk/tengo-builder": 4.0.22
  "@platforma-sdk/package-builder": 3.15.0
  "@platforma-sdk/blocks-deps-updater": 2.2.0
  "@milaboratories/ts-builder": 1.6.2
  "@milaboratories/ts-configs": 1.4.0
  # Must match the version @platforma-sdk/model depends on, otherwise the model's
  # inferred type references a non-direct copy and the build fails TS2742.
  "@milaboratories/helpers": 1.14.5

  # Region annotation. ANARCI is a shared, already-published artifact — reused rather
  # than introduced here, per the spec's requirement that the instrument already exist
  # in the workspace. Versions follow blocks/redefine-clonotypes, its other consumer.
  "@platforma-open/milaboratories.runenv-python-3": ^1.1.16
  "@platforma-open/milaboratories.software-anarci": ^1.0.1

  "vue": 3.5.24

  "typescript": ~5.6.3
  "turbo": ^2.5.8

  "vitest": ~4.0.18
  'shx': ^0.4.0

  "@changesets/cli": ^2.29.6

  # other blocks used in tests
  "@platforma-open/milaboratories.samples-and-data": 1.18.1
  "@platforma-open/milaboratories.sequence-properties": 1.5.2
